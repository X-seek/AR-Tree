<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Change-Lang</title>
    <!-- ฟอนต์ -->
    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="lang-container">
      <label class="lang-toggle">
        <input type="checkbox" id="lang-check" hidden />
        <div class="lang-slider">
          <img
            src="/assets/images/flags/th.png"
            alt="TH"
            class="flag flag-th"
          />
          <img
            src="/assets/images/flags/en.png"
            alt="EN"
            class="flag flag-en"
          />
        </div>
      </label>
    </div>
  </body>
</html>
