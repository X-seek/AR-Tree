<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hotspot Menu</title>

    <!-- ฟอนต์ไทย -->
    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/style/style-hotspot.css" />
    <base href="/AR-Tree/" />
  </head>
  <body>
    <div class="hotspot-menu">
      <div class="submenu">
        <button onclick="showHotspot('fruit')">
          <img src="/assets/images/logo-menu/fruits.png" alt="ผลไม้" />
        </button>
        <button onclick="showHotspot('leaf')">
          <img src="/assets/images/logo-menu/leaf.png" alt="ใบไม้" />
        </button>
        <button onclick="showHotspot('trunk')">
          <img src="/assets/images/logo-menu/trunk.png" alt="ลำต้น" />
        </button>
        <button onclick="showHotspot('root')">
          <img src="/assets/images/logo-menu/root.png" alt="ราก" />
        </button>
        <button onclick="showHotspot('care')">
          <img src="/assets/images/logo-menu/planting.png" alt="วิธีดูแล" />
        </button>

        <!-- ปุ่ม gallery แทนลิงก์ -->
        <button onclick="openModelGallery()">
          <img
            src="/assets/images/logo-menu/forest.png"
            alt="เลือกดูโมเดลอื่นๆ"
          />
        </button>

        <button>
          <a href="assets/page_models/tool-bar/map.html">
            <img src="/assets/images/logo-menu/map.png" alt="แผนที่/แผนผัง"
          /></a>
        </button>
      </div>

      <!-- ปุ่มหลัก -->
      <button class="main-btn" onclick="toggleMenu()">
        <img src="/assets/images/logo-menu/plus.png" alt="เมนู" />
      </button>
    </div>

    <!-- Hotspot popup (ต้องอยู่ใน DOM เพื่อให้ JS หาได้) -->
    <div id="hotspot-ui" class="hotspot-ui" aria-hidden="true">
      <h3 id="hotspot-title"></h3>
      <img id="hotspot-img" src="" alt="hotspot image" />
      <p id="hotspot-desc"></p>
      <audio id="hotspot-audio" src=""></audio>
      <div class="button-group">
        <button id="play-sound" data-i18n="ui.play">▶ เล่นเสียง</button>
        <button id="close-ui" data-i18n="ui.close">✖ ปิด</button>
      </div>
    </div>

    <!-- ================== Popup Model Gallery ================== -->
    <div id="model-gallery" class="model-gallery" aria-hidden="true">
      <div class="gallery-content">
        <button class="close-btn top-right" onclick="closeModelGallery()">
          ✖
        </button>
        <h2 data-i18n="gallery.title">เลือกดูโมเดลต้นไม้</h2>

        <div class="gallery-grid">
          <div class="gallery-item">
            <a href="/index.html">
              <model-viewer
                src="/assets/models/bnn-v1.glb"
                alt="ต้นกล้วย"
                disable-zoom
                disable-pan
                disable-tap
              ></model-viewer>
              <h3 data-i18n="gallery.items.banana1">กล้วย</h3>
            </a>
          </div>

          <div class="gallery-item">
            <a href="/assets/page_models/coconut.html">
              <model-viewer
                src="/assets/models/coconut.glb"
                alt="มะพร้าว"
                disable-zoom
                disable-pan
                disable-tap
              ></model-viewer>
              <h3 data-i18n="gallery.items.coconut1">มะพร้าว</h3>
            </a>
          </div>

          <div class="gallery-item">
            <a href="/assets/page_models/custard-apple.html">
              <model-viewer
                src="/assets/models/custard-apple-v1.glb"
                alt="น้อยหน่า"
                disable-zoom
                disable-pan
                disable-tap
              ></model-viewer>
              <h3 data-i18n="gallery.items.custardApple1">น้อยหน่า</h3>
            </a>
          </div>

          <div class="gallery-item">
            <a href="/assets/page_models/fig.html">
              <model-viewer
                src="/assets/models/fig.glb"
                alt="มะเดื่อ"
                disable-zoom
                disable-pan
                disable-tap
              ></model-viewer>
              <h3 data-i18n="gallery.items.fig1">มะเดื่อ</h3>
            </a>
          </div>

          <div class="gallery-item">
            <a href="/assets/page_models/guava.html">
              <model-viewer
                src="/assets/models/guava.glb"
                alt="ฝรั่ง"
                disable-zoom
                disable-pan
                disable-tap
              ></model-viewer>
              <h3 data-i18n="gallery.items.guava1">ฝรั่ง</h3>
            </a>
          </div>

          <div class="gallery-item">
            <a href="/assets/page_models/lime.html">
              <model-viewer
                src="/assets/models/lime-v1.glb"
                alt="มะนาว"
                disable-zoom
                disable-pan
                disable-tap
              ></model-viewer>
              <h3 data-i18n="gallery.items.lime1">มะนาว</h3>
            </a>
          </div>

          <div class="gallery-item">
            <a href="/assets/page_models/longan.html">
              <model-viewer
                src="/assets/models/longan.glb"
                alt="อ้อย"
                disable-zoom
                disable-pan
                disable-tap
              ></model-viewer>
              <h3 data-i18n="gallery.items.longan1">ลำไย</h3>
            </a>
          </div>

          <div class="gallery-item">
            <a href="/assets/page_models/mango.html">
              <model-viewer
                src="/assets/models/mango.glb"
                alt="มะม่วง"
                disable-zoom
                disable-pan
                disable-tap
              ></model-viewer>
              <h3 data-i18n="gallery.items.mango1">มะม่วง</h3>
            </a>
          </div>

          <div class="gallery-item">
            <a href="/assets/page_models/sapodilla.html">
              <model-viewer
                src="/assets/models/sapodilla.glb"
                alt="ละมุด"
                disable-zoom
                disable-pan
                disable-tap
              ></model-viewer>
              <h3 data-i18n="gallery.items.sapodilla1">ละมุด</h3>
            </a>
          </div>
          <div class="gallery-item">
            <a href="/assets/page_models/pomelo.html">
              <model-viewer
                src="/assets/models/pomelo.glb"
                alt="ละมุด"
                disable-zoom
                disable-pan
                disable-tap
              ></model-viewer>
              <h3 data-i18n="gallery.items.pomelo1">ส้มโอ</h3>
            </a>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
