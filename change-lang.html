<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Change-Lang</title>
    <!-- ฟอนต์ -->
    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- ปุ่มสลับภาษา -->
    <div class="lang-container">
      <input hidden id="lang-check" type="checkbox" />
      <label class="lang-toggle" for="lang-check">
        <div class="lang-toggle__circle"></div>
      </label>
      <div class="lang-toggle-text">
        <span>EN <img src="images/flags/en.png" alt="EN" width="18" /></span>
        <span>TH <img src="images/flags/th.png" alt="TH" width="18" /></span>
      </div>
    </div>
  </body>
</html>
