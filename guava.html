<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coconut 3D Tree AR</title>
    <script type="module"
      src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="style/style-hotspot.css" />
    <link rel="stylesheet" href="style/style-index.css" />
    <link rel="stylesheet" href="style/style-change-lang.css" />
  </head>
  <body>
    <div class="viewer-container">
      <!-- ปุ่มเปลี่ยนภาษา -->
      <div id="change-lang-container"></div>

      <!-- โมเดล -->
      <model-viewer
        id="viewer"
        src="Model/guava.glb"
        ar
        ar-modes="webxr scene-viewer quick-look"
        auto-rotate
        camera-controls
        exposure="1"
        environment-image="neutral"
        shadow-intensity="3">
      </model-viewer>

      <!-- ชื่อด้านบน -->
      <div class="title" data-i18n="page.title">มะพร้าว</div>

      <!-- ปุ่ม Hotspot -->
      <div id="hotspot-menu-container"></div>
    </div>

    <!-- โหลด fragment -->
    <script>
      async function loadPart(id, file) {
        const res = await fetch(file);
        const html = await res.text();
        document.getElementById(id).innerHTML = html;
      }

      Promise.all([
        loadPart("change-lang-container", "change-lang.html"),
        loadPart("hotspot-menu-container", "hotspot-menu.html"),
      ]).then(() => {
        // เมื่อ fragment โหลดเสร็จ ค่อย bind JS
        const lang = document.createElement("script");
        lang.src = "js/coconut-lang.js";
        lang.onload = () => {
          if (window.i18n) {
            window.i18n.setLanguage(localStorage.getItem("lang") || "th");
            window.i18n.initToggle();
          }
        };
        document.body.appendChild(lang);

        const hotspot = document.createElement("script");
        hotspot.src = "js/menu-hotspot.js";
        document.body.appendChild(hotspot);
      });
    </script>
  </body>
</html>
