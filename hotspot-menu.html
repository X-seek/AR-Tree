<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hotspot Menu</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="hotspot-menu" id="hotspotMenu">
      <button class="main-btn" id="mainBtn">
        <img src="images/logo-menu/main-menu.png" alt="เมนู" />
      </button>
      <div class="submenu">
        <button onclick="showHotspot('fruit')" data-key="fruit" data-alt="ผล">
          <img src="images/logo-menu/fruits.png" alt="ผล" />
        </button>

        <button onclick="showHotspot('leaf')" data-key="leaf" data-alt="ใบ">
          <img src="images/logo-menu/leaf.png" alt="ใบ" />
        </button>

        <button onclick="showHotspot('trunk')" data-key="trunk" data-alt="ลำต้น">
          <img src="images/logo-menu/trunk.png" alt="ลำต้น" />
        </button>

        <button onclick="showHotspot('root')" data-key="root" data-alt="ราก">
          <img src="images/logo-menu/root.png" alt="ราก" />
        </button>

        <button onclick="showHotspot('care')" data-key="care" data-alt="ดูแล">
          <img src="images/logo-menu/planting.png" alt="ดูแล" />
        </button>

        <button onclick="openModelGallery()" data-key="gallery" data-alt="โมเดลอื่น ๆ">
          <img src="images/logo-menu/forest.png" alt="โมเดลอื่น ๆ" />
        </button>

        <button data-key="map" data-alt="แผนที่">
          <a href="map.html">
            <img src="images/logo-menu/map.png" alt="แผนที่" />
          </a>
        </button>
      </div>
    </div>

    <div id="hotspot-ui" class="hotspot-ui" aria-hidden="true">
      <!-- ปุ่มปิด -->
      <button id="close-ui" class="hotspot-close" data-i18n="ui.close">
        ✖
      </button>

      <!-- ปุ่มเล่นเสียง -->
      <button id="play-sound" class="hotspot-sound" data-i18n="ui.play">
        ▶
      </button>

      <!-- ส่วนรูปภาพ -->
      <div class="hotspot-image">
        <img id="hotspot-img" src="" alt="hotspot image" />
      </div>

      <!-- ส่วนข้อมูล -->
      <div class="hotspot-info">
        <h3 id="hotspot-title"></h3>
        <p id="hotspot-desc"></p>
      </div>

      <!-- Audio element -->
      <audio id="hotspot-audio" src=""></audio>
    </div>

    <div id="model-gallery" class="model-gallery" aria-hidden="true">
      <div class="gallery-content">
        <button class="close-btn top-right" onclick="closeModelGallery()">
          ✖
        </button>
        <h2 data-i18n="gallery.title">เลือกดูโมเดลต้นไม้</h2>

        <div class="gallery-grid">
          <div class="gallery-item">
            <a href="index.html">
              <h3 data-i18n="gallery.items.banana1">กล้วย</h3>
              <model-viewer
                src="models/bnn-v1.glb"
                alt="กล้วย"
                disable-zoom
                disable-pan
                disable-tap
              ></model-viewer>
            </a>
          </div>

          <div class="gallery-item">
            <a href="custard-apple.html">
              <h3 data-i18n="gallery.items.custardApple1">น้อยหน่า</h3>
              <model-viewer
                src="models/custard-apple-v1.glb"
                alt="น้อยหน่า"
                disable-zoom
                disable-pan
                disable-tap
              ></model-viewer>
            </a>
          </div>

          <div class="gallery-item">
            <a href="fig.html">
              <h3 data-i18n="gallery.items.fig1">มะเดื่อ</h3>
              <model-viewer
                src="models/fig.glb"
                alt="มะเดื่อ"
                disable-zoom
                disable-pan
                disable-tap
              ></model-viewer>
            </a>
          </div>

          <div class="gallery-item">
            <a href="guava.html">
              <h3 data-i18n="gallery.items.guava1">ฝรั่ง</h3>
              <model-viewer
                src="models/guava.glb"
                alt="ฝรั่ง"
                disable-zoom
                disable-pan
                disable-tap
              ></model-viewer>
            </a>
          </div>
          <div class="gallery-item">
            <a href="lime.html">
              <h3 data-i18n="gallery.items.lime1">มะนาว</h3>
              <model-viewer
                src="models/lime-v1.glb"
                alt="มะนาว"
                disable-zoom
                disable-pan
                disable-tap
              ></model-viewer>
            </a>
          </div>
          <div class="gallery-item">
            <a href="longan.html">
              <h3 data-i18n="gallery.items.longan1">ลำไย</h3>
              <model-viewer
                src="models/longan.glb"
                alt="ลำไย"
                disable-zoom
                disable-pan
                disable-tap
              ></model-viewer>
            </a>
          </div>
          <div class="gallery-item">
            <a href="mango.html">
              <h3 data-i18n="gallery.items.mango1">มะม่วง</h3>
              <model-viewer
                src="models/mango.glb"
                alt="มะม่วง"
                disable-zoom
                disable-pan
                disable-tap
              ></model-viewer>
            </a>
          </div>
          <div class="gallery-item">
            <a href="pomelo.html">
              <h3 data-i18n="gallery.items.pomelo1">ส้มโอ</h3>
              <model-viewer
                src="models/pomelo.glb"
                alt="ส้มโอ"
                disable-zoom
                disable-pan
                disable-tap
              ></model-viewer>
            </a>
          </div>
          <div class="gallery-item">
            <a href="sapodilla.html">
              <h3 data-i18n="gallery.items.sapodilla1">ละมุด</h3>
              <model-viewer
                src="models/sapodilla.glb"
                alt="ละมุด"
                disable-zoom
                disable-pan
                disable-tap
              ></model-viewer>
            </a>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
