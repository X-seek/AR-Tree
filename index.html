<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Banana 3D Tree AR</title>

    <!-- model-viewer -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>

    <!-- Fonts + Styles -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./assets/style/style-hotspot.css" />
    <link rel="stylesheet" href="./assets/style/style-index.css" />
    <link rel="stylesheet" href="./assets/style/style-change-lang.css" />
  </head>

  <body>
    <div class="viewer-container">
      <!-- language -->
      <div id="change-lang-container"></div>

      <!-- model -->
      <model-viewer
        id="viewer"
        src="./assets/models/bnn-v1.glb"
        ar
        ar-modes="webxr scene-viewer quick-look"
        auto-rotate
        camera-controls
        exposure="1"
        environment-image="neutral"
        shadow-intensity="3"
      ></model-viewer>

      <!-- title -->
      <div class="title" data-i18n="page.title">กล้วย</div>

      <!-- hotspot menu -->
      <div id="hotspot-menu-container"></div>
    </div>

    <script src="./assets/js/loadPart.js"></script>
    <script>
      Promise.all([
        loadPart("change-lang-container", "./assets/page_models/tool-bar/change-lang.html"),
        loadPart("hotspot-menu-container", "./assets/page_models/tool-bar/hotspot-menu.html"),
      ]).then(() => {
        const lang = document.createElement("script");
        lang.src = "./assets/js/banana-lang.js";
        lang.onload = () => {
          if (window.i18n) {
            window.i18n.setLanguage(localStorage.getItem("lang") || "th");
            window.i18n.initToggle();
            window.i18n.applyStaticTranslations();
          }
        };
        document.body.appendChild(lang);

        const hotspot = document.createElement("script");
        hotspot.src = "./assets/js/menu-hotspot.js";
        document.body.appendChild(hotspot);
      });
    </script>
  </body>
</html>
