<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Banana 3D Tree AR</title>
    <!-- โหลด model-viewer -->
    <script
      type="module"
      src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"
    ></script>
    <!-- ฟอนต์ไทยน่ารัก -->
    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="viewer-container">
      <!-- โมเดล -->
      <model-viewer
        id="viewer"
        src="Model/1banana_tree_low_poly.glb"
        ar
        ar-modes="webxr scene-viewer quick-look"
        auto-rotate
        camera-controls
        exposure="1"
        environment-image="neutral"
        shadow-intensity="3"
      >
      </model-viewer>

      <!-- ชื่อด้านบน -->
      <div class="title">🌴 ต้นกล้วย🌴</div>

      <!-- ปุ่ม Hotspot ด้านขวา -->
      <div class="hotspot-menu">
        <button id="btn-fruit">
          <img src="images/logo-menu/fruits.png" alt="ผลไม้" />
        </button>
        <button id="btn-leaf">
          <img src="images/logo-menu/leaf.png" alt="ใบไม้" />
        </button>
        <button id="btn-flower">
          <img src="images/logo-menu/sakura.png" alt="ดอก" />
        </button>
        <button id="btn-trunk">
          <img src="images/logo-menu/trunk.png" alt="ลำต้น" />
        </button>
        <button id="btn-root">
          <img src="images/logo-menu/root.png" alt="ราก" />
        </button>
        <button id="btn-care">
          <img src="images/logo-menu/plant-a-tree.png" alt="วิธีดูแล" />
        </button>
      </div>

      <!-- Popup UI -->
      <div id="hotspot-ui" class="hotspot-ui">
        <h3 id="hotspot-title"></h3>
        <img id="hotspot-img" src="" alt="ภาพ Hotspot" />
        <p id="hotspot-desc"></p>
        <audio id="hotspot-audio" src=""></audio>
        <div class="button-group">
          <button id="play-sound">▶ เล่นเสียง</button>
          <button id="close-ui">✖ ปิด</button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
