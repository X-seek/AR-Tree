<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Banana 3D Tree AR</title>

    <!-- model-viewer -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>

    <!-- Fonts + Styles -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="assets/style/style-hotspot.css" />
    <link rel="stylesheet" href="assets/style/style-index.css" />
    <link rel="stylesheet" href="assets/style/style-change-lang.css" />
  </head>

  <body>
    <div class="viewer-container">
      <!-- language -->
      <div id="change-lang-container"></div>

      <!-- model -->
      <model-viewer
        id="viewer"
        src="assets/models/bnn-v1.glb"
        ar
        ar-modes="webxr scene-viewer quick-look"
        auto-rotate
        camera-controls
        exposure="1"
        environment-image="neutral"
        shadow-intensity="3"
      ></model-viewer>

      <!-- title -->
      <div class="title" data-i18n="page.title">กล้วย</div>

      <!-- hotspot menu -->
      <div id="hotspot-menu-container"></div>
    </div>

   <script>
      async function loadPart(id, file) {
        const res = await fetch(file);
        if (!res.ok) return;
        const html = await res.text();
        document.getElementById(id).innerHTML = html;
      }

      Promise.all([
        loadPart("change-lang-container", "assets/page_models/change-lang.html"),
        loadPart("hotspot-menu-container", "../page_models/hotspot-menu.html"),
      ]).then(() => {
        // ✅ โหลดสคริปต์แปลภาษา
        const lang = document.createElement("script");
        lang.src = "assets/js/banana-lang.js"; // ชื่อไฟล์ที่ถูกต้อง
        lang.onload = () => {
          if (window.i18n) {
            window.i18n.setLanguage(localStorage.getItem("lang") || "th");
            window.i18n.initToggle();
            window.i18n.applyStaticTranslations(); // ✅ เรียกให้ fragment ถูกแปลด้วย
          }
        };
        document.body.appendChild(lang);

        // ✅ โหลดสคริปต์ hotspot หลังจากนั้น
        const hotspot = document.createElement("script");
        hotspot.src = "../js/menu-hotspot.js";
        document.body.appendChild(hotspot);
      });

      // ฟังก์ชันเปิด/ปิด gallery
      function openModelGallery() {
        document.getElementById("model-gallery").classList.add("active");
      }
      function closeModelGallery() {
        document.getElementById("model-gallery").classList.remove("active");
      }
    </script>
  </body>
</html>
