<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>แผนผังไร่ - ลุงสายันต์ (Interactive Map)</title>

    <!-- model-viewer -->
    <script
      type="module"
      src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"
    ></script>

    <link rel="stylesheet" href="style/style-map.css" />
    <link rel="stylesheet" href="style/style-change-lang.css" />
  </head>
  <body>

 <!-- language -->
      <div id="change-lang-container"></div>

    <button class="back-btn" onclick="goBack()">← ย้อนกลับ</button>
    <header class="topbar">
      <h1>แผนผังไร่ — ลุงสายันต์</h1>
      <p class="hint">คลิกที่จุด (mark) เพื่อดูโมเดลของต้นไม้/แปลงต่างๆ</p>
    </header>

    <main class="map-wrap">
      <div id="map-container" class="map-container">
        <img
          src="images/map/map.png"
          alt="แผนผังไร่"
          class="map-image"
          id="farmMap"
        />
        <div id="markers" class="markers"></div>
      </div>
    </main>

    <aside class="sidebar" id="sidebar">
      <h3>รายการตำแหน่ง</h3>
      <ul class="markerList" id="markerList"></ul>
    </aside>

    <div id="modelModal" class="modal" aria-hidden="true">
      <div class="modal-content">
        <button id="modalClose" class="modal-close" aria-label="Close">✖</button>
        <h2 id="modalTitle">ชื่อโมเดล</h2>
        <model-viewer
          id="modalModel"
          src=""
          alt=""
          ar
          camera-controls
          auto-rotate
          exposure="1"
          style="
            width: 100%;
            max-height: 60vh;
            height: 60vh;
            background: #0f1410;
            border-radius: 8px;">
        </model-viewer>
        <div class="modal-actions">
          <a id="openModelPage" class="btn" href="#" target="_blank">เปิดหน้าโมเดล</a>
          <button id="closeBtn" class="btn alt">ปิด</button>
        </div>
      </div>
    </div>

    <script src="js/map.js"></script>
    <script src="js/map-lang.js"></script>
  </body>
</html>
