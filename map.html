<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>แผนผังไร่ - ลุงสายันต์ (Interactive Map)</title>

    <!-- model-viewer -->
    <script
      type="module"
      src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"
    ></script>

    <link rel="stylesheet" href="style/style-map.css" />
  </head>
  <body>
    <button class="back-btn" onclick="goBack()">← ย้อนกลับ</button>
    <header class="topbar">
      <h1>แผนผังไร่ — ลุงสายันต์</h1>
      <p class="hint">คลิกที่จุด (mark) เพื่อดูโมเดลของต้นไม้/แปลงต่างๆ</p>
    </header>

    <main class="map-wrap">
      <!-- ภาพแผนที่ (เปลี่ยนไฟล์เป็นของคุณได้) -->
      <img
        src="images/map/map.png"
        alt="แผนผังไร่"
        class="map-image"
        id="farmMap"/>

      <!-- markers จะสร้างด้วย JS แต่ตัวอย่าง HTML สำหรับ fallback
         แต่เรสร้างจาก JS ให้สะดวกในการแก้พิกัด -->
      <div id="markers" class="markers"></div>
    </main>

    <!-- Sidebar (รายการจุด) -->
    <aside class="sidebar" id="sidebar">
      <h3>รายการตำแหน่ง</h3>
      <ul id="markerList"></ul>
    </aside>

    <!-- Modal / Lightbox แสดง model -->
    <div id="modelModal" class="modal" aria-hidden="true">
      <div class="modal-content">
        <button id="modalClose" class="modal-close" aria-label="Close">
          ✖
        </button>
        <h2 id="modalTitle">ชื่อโมเดล</h2>

        <!-- model-viewer แสดงโมเดล (disable interaction เพื่อให้เป็น static หรือ เปิดได้ตามต้องการ) -->
        <model-viewer
          id="modalModel"
          src=""
          alt=""
          ar
          camera-controls
          auto-rotate
          exposure="1"
          style="
            width: 100%;
            max-height: 60vh;
            height: 60vh;
            background: #0f1410;
            border-radius: 8px;">
        </model-viewer>

        <div class="modal-actions">
          <a id="openModelPage" class="btn" href="#" target="_blank"
            >เปิดหน้าโมเดล</a>
          <button id="closeBtn" class="btn alt">ปิด</button>
        </div>
      </div>
    </div>

    <script src="js/map.js"></script>
  </body>
</html>
