<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sapodilla 3D Tree AR</title>
    <script
      type="module"
      src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"
    ></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/style/style-hotspot.css" />
    <link rel="stylesheet" href="/assets/style/style-index.css" />
    <link rel="stylesheet" href="/assets/style/style-change-lang.css" />
    <base href="/AR-Tree/" />
  </head>
  <body>
    <div class="viewer-container">
      <!-- ปุ่มเปลี่ยนภาษา -->
      <div id="change-lang-container"></div>

      <!-- โมเดล -->
      <model-viewer
        id="viewer"
        src="/assets/models/sapodilla.glb"
        ar
        ar-modes="webxr scene-viewer quick-look"
        auto-rotate
        camera-controls
        exposure="1"
        environment-image="neutral"
        shadow-intensity="3"
      >
      </model-viewer>

      <!-- ชื่อด้านบน -->
      <div class="title" data-i18n="page.title">ละมุด</div>

      <!-- ปุ่ม Hotspot -->
      <div id="hotspot-menu-container"></div>
    </div>

    <!-- โหลด fragment -->
    <script>
      async function loadPart(id, file) {
        const res = await fetch(file);
        const html = await res.text();
        document.getElementById(id).innerHTML = html;
      }

      Promise.all([
        loadPart(
          "change-lang-container",
          "/assets/page_models/tool-bar/change-lang.html"
        ),
        loadPart(
          "hotspot-menu-container",
          "/assets/page_models/tool-bar/hotspot-menu.html"
        ),
      ]).then(() => {
        const lang = document.createElement("script");
        lang.src = "/assets/js/sapodilla-lang.js"; // path นี้ถูกแล้ว
        lang.onload = () => {
          if (window.i18n) {
            window.i18n.setLanguage(localStorage.getItem("lang") || "th");
            window.i18n.initToggle();
            window.i18n.applyStaticTranslations();
          }
        };
        document.body.appendChild(lang);

        const hotspot = document.createElement("script");
        hotspot.src = "/assets/js/menu-hotspot.js"; // path ถูกแล้ว
        document.body.appendChild(hotspot);
      });

      //  Gallery
      function openModelGallery() {
        document.getElementById("model-gallery").classList.add("active");
      }
      function closeModelGallery() {
        document.getElementById("model-gallery").classList.remove("active");
      }
    </script>

    <!-- ✅ โหลด library ของ model-viewer -->
  </body>
</html>
