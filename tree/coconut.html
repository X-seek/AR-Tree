<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coconut 3D Tree AR</title>
    <!-- โหลด model-viewer -->
    <script
      type="module"
      src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"
    ></script>
    <!-- ฟอนต์ไทยน่ารัก -->
    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style/style.css" />
  </head>
  <body>
    <div class="viewer-container">
      <!-- ปุ่มสลับภาษา -->
      <div class="lang-container">
        <input hidden id="lang-check" type="checkbox" />
        <label class="lang-toggle" for="lang-check">
          <div class="lang-toggle__circle"></div>
        </label>
        <div class="lang-toggle-text">
          <span>EN <img src="/images/flags/en.png" alt="EN" width="18" /></span>
          <span>TH <img src="/images/flags/th.png" alt="TH" width="18" /></span>
        </div>
      </div>

      <!-- โมเดล -->
      <model-viewer
        id="viewer"
        src="/Model/coconut.glb"
        ar
        ar-modes="webxr scene-viewer quick-look"
        auto-rotate
        camera-controls
        exposure="1"
        environment-image="neutral"
        shadow-intensity="3"
      >
      </model-viewer>

      <!-- ชื่อด้านบน -->
      <div class="title" data-i18n="page.title">ต้นมะพร้าว</div>

      <!-- ปุ่ม Hotspot -->
      <div class="hotspot-menu">
        <!-- ปุ่มลูก (ทั้งหมดซ่อนอยู่ตอนแรก) -->
        <div class="submenu">
          <button onclick="showHotspot('fruit')">
            <img src="/images/logo-menu/fruits.png" alt="ผลไม้" />
          </button>
          <button onclick="showHotspot('leaf')">
            <img src="/images/logo-menu/leaf.png" alt="ใบไม้" />
          </button>
          <button onclick="showHotspot('flower')">
            <img src="/images/logo-menu/sakura.png" alt="ดอก" />
          </button>
          <button onclick="showHotspot('trunk')">
            <img src="/images/logo-menu/trunk.png" alt="ลำต้น" />
          </button>
          <button onclick="showHotspot('root')">
            <img src="/images/logo-menu/root.png" alt="ราก" />
          </button>
          <button onclick="showHotspot('care')">
            <img src="/images/logo-menu/planting.png" alt="วิธีดูแล" />
          </button>
          <button>
            <a href="/tree/coconut.html">
              <img src="/images/logo-menu/forest.png" alt="โมเดลอื่น" />
            </a>
          </button>
        </div>
        <!-- ปุ่มหลัก (circle-plus) -->
        <button class="main-btn" onclick="toggleMenu()">
          <img src="/images/logo-menu/circle-plus.png" alt="เมนู" />
        </button>
      </div>

      <!-- Popup UI -->
      <div id="hotspot-ui" class="hotspot-ui">
        <h3 id="hotspot-title"></h3>
        <img id="hotspot-img" src="" alt="ภาพ Hotspot" />
        <p id="hotspot-desc"></p>
        <audio id="hotspot-audio" src=""></audio>
        <div class="button-group">
          <button id="play-sound" data-i18n="ui.play">▶ เล่นเสียง</button>
          <button id="close-ui" data-i18n="ui.close">✖ ปิด</button>
        </div>
      </div>
    </div>

    <script src="/js/hotspot.js"></script>
    <script src="/js/lang.js"></script>
  </body>
</html>
